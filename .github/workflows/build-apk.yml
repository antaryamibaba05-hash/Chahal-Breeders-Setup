name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK Exists
        id: verify-apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
            APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1048576" | bc)
            echo "Debug APK built successfully at $APK_PATH"
            echo "APK Size: ${APK_SIZE_MB} MB ($APK_SIZE bytes)"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "apk_size_mb=$APK_SIZE_MB" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Debug APK not found at $APK_PATH" >&2
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chahal-Breeders-Setup-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add Build Summary
        if: always()
        run: |
          echo "## 🕊️ Chahal Breeders Setup - Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Application Name** | Chahal Breeders Setup |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Application ID** | \`com.highflyerpro.tracker\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Git Ref** | \`${{ github.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "| **Build Status** | ✅ Success |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **APK Size** | ${{ steps.verify-apk.outputs.apk_size_mb }} MB |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Artifact** | \`Chahal-Breeders-Setup-APK\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Build Status** | ❌ Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi
